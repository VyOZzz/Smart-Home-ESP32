# MQTT broker for local development and LAN testing.
# Authentication is intentionally disabled until the ESP32/backend integration
# has been verified. Do not expose port 1883 directly to the Internet.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
